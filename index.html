<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <link rel="icon" href="./Mohan.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pliant:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body >

    <div class="container">
        <div class="form">
            <h1 class="login">Log in to your account</h1>
            <div class="row1">
                <h3 class="email">Email</h3>
                <input type="email" placeholder="Enter your email" class="input">

            </div>
            <div class="row2">
                <h3 class="password">Password</h3>
                <input type="password" placeholder="Enter password" class="input">

            </div>
            <div class="row3">
                <button class="button">Sign in</button>
            </div>
            <h5 class="oldaccount">Dont have an account? <span class="signup">Sign up now</span></h5>
        </div>
    </div>
</body>
</html>
